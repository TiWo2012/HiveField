name: Release

# Builds Linux executables and publishes a GitHub release, but only on
# pushes / merges to `master`. Tests run first via the shared test workflow.
on:
  push:
    branches: [master]

jobs:
  tests:
    name: Run tests
    uses: ./.github/workflows/test.yml

  build-linux:
    name: Build Linux executables
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      # Embedded into the binary by src-tauri/build.rs so the built-in updater
      # knows this build's number: release tags are v<version>-build.<run_number>,
      # and a binary that only knows "0.1.1" would compare as older than every
      # tagged release and perpetually report an update available.
      HF_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake curl wget file \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libasound2-dev \
            libfuse2t64

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build Linux bundles (deb, rpm, AppImage)
        run: bun run tauri build --bundles deb,appimage,rpm

      - name: Collect artifacts
        run: |
          mkdir -p release-artifacts updater-asset
          cp src-tauri/target/release/hivefield release-artifacts/
          cp src-tauri/target/release/bundle/deb/*.deb release-artifacts/
          cp src-tauri/target/release/bundle/rpm/*.rpm release-artifacts/
          cp src-tauri/target/release/bundle/appimage/*.AppImage release-artifacts/
          # Updater assets: the built-in updater and install.sh pick the
          # tarball by this exact name (see src-tauri/src/updater.rs asset_name
          # and the repo-root install.sh); the bare binary is the fallback.
          # The tarball also carries the app icon (hivefield.png) so both
          # installers can register a .desktop menu entry with a proper icon
          # (see updater.rs extract_archive / install.sh install_desktop_entry).
          cp src-tauri/target/release/hivefield updater-asset/hivefield-linux-x86_64
          cp src-tauri/icons/128x128.png src-tauri/target/release/hivefield.png
          tar -czf updater-asset/hivefield-linux-x86_64.tar.gz -C src-tauri/target/release hivefield hivefield.png
          ls -lh release-artifacts/ updater-asset/
          APP_VERSION="$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: hivefield-linux
          path: |
            release-artifacts
            updater-asset

      # A new tag is minted per master push (version + build number) so every
      # release lands without manual tag management; bump the version in
      # tauri.conf.json / Cargo.toml to start a new version series.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build.${{ github.run_number }}
          name: hiveField Terminal v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: |
            Automated Linux release built from `master` at `${{ github.sha }}`.

            - Updater tarball (`hivefield-linux-x86_64.tar.gz`) — used by
              the built-in updater and `install.sh`
            - Raw executable
            - `.deb` package
            - `.rpm` package
            - AppImage
          files: |
            release-artifacts/*
            updater-asset/*
