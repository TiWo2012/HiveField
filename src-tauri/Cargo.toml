[package]
name = "hivefield"
version = "0.1.0"
description = "A basic terminal built with Tauri and xterm.js"
edition = "2021"

[lib]
name = "hivefield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
portable-pty = "0.9"
fontdb = "0.24.0"
# ureq v3 — v2 is unmaintained upstream. TLS (rustls) is a default feature
# in v3 (the old `tls` feature no longer exists). v3 dropped `Error::Status`,
# so HTTP status handling uses the per-request `http_status_as_error(false)`
# config instead (see dictation.rs).
ureq = "3"
cpal = "0.18.1"
rubato = "4.0.0"
# whisper-rs is a binding to whisper.cpp and 0.16 is its newest crate release;
# it pins a specific whisper.cpp revision, so bump deliberately — the bundled
# binary format must stay compatible with the ggml-base.en.bin model downloaded
# from MODEL_URL in dictation.rs.
whisper-rs = "0.16"
# vosk is a thin FFI wrapper over a *prebuilt* libvosk.so (not built from
# source). 0.3.1 must stay in lockstep with the libvosk.so installed on dev
# machines and in CI (.github/workflows/*.yml installs vosk-api 0.3.45).
vosk = "0.3.1"
# zip v2 — the extraction API used in dictation.rs (ZipArchive::new/extract)
# is unchanged from 0.6, so this is a pure safety/feature bump.
zip = "2"

[dev-dependencies]
tempfile = "3"
