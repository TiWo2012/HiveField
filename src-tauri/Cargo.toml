[package]
name = "hivefield"
version = "0.1.0"
description = "A basic terminal built with Tauri and xterm.js"
edition = "2021"

[lib]
name = "hivefield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
portable-pty = "0.9"
fontdb = "0.24.0"

[dev-dependencies]
tempfile = "3"
