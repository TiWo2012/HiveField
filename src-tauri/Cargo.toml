[package]
name = "hivefield"
version = "0.1.0"
description = "A basic terminal built with Tauri and xterm.js"
edition = "2021"

[lib]
name = "hivefield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
portable-pty = "0.9"
fontdb = "0.24.0"
ureq = { version = "2", features = ["tls"] }
cpal = "0.18.1"
rubato = "4.0.0"
whisper-rs = "0.16"
vosk = "0.3.1"
zip = "0.6"

[dev-dependencies]
tempfile = "3"
