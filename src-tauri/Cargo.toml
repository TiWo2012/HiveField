[package]
name = "hivefield"
version = "0.1.2"
description = "A basic terminal built with Tauri and xterm.js"
edition = "2021"

[lib]
name = "hivefield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
portable-pty = "0.9"
fontdb = "0.24.0"
# Resolve the platform's config/data dirs without a running Tauri app, so
# `hivefield --doctor` (a pre-boot arg check in main.rs) can report the same
# app-scoped paths Tauri resolves in-process (see diagnostics.rs).
dirs = "6"
# ureq v3 — v2 is unmaintained upstream. TLS (rustls) is a default feature
# in v3 (the old `tls` feature no longer exists). v3 dropped `Error::Status`,
# so HTTP status handling uses the per-request `http_status_as_error(false)`
# config instead (see net.rs).
ureq = "3"
# Release tarball extraction for the built-in updater (updater.rs). install.sh
# uses the system `tar`; the app reads the archive directly so it never has to
# shell out. flate2 is already in the tree via other deps; tar is new.
tar = "0.4"
flate2 = "1"
cpal = "0.18.1"
rubato = "4.0.0"
# whisper-rs is a binding to whisper.cpp and 0.16 is its newest crate release;
# it pins a specific whisper.cpp revision, so bump deliberately — the bundled
# binary format must stay compatible with the ggml-base.en.bin model.
# Gated behind the `whisper` feature: when off, only cloud dictation is
# available and the build does not need cmake or a C++ compiler.
whisper-rs = { version = "0.16", optional = true }

[features]
default = []
# Enable local Whisper transcription (requires cmake + C++ compiler to build whisper.cpp).
whisper = ["dep:whisper-rs"]

[dev-dependencies]
tempfile = "3"
