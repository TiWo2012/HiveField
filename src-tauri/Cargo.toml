[package]
name = "hivefield"
version = "0.1.2"
description = "A basic terminal built with Tauri and xterm.js"
edition = "2021"

[lib]
name = "hivefield_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
# Logger backend: writes a rotated file under the app log dir and (in debug
# builds) to stderr. Initialized in lib.rs; the panic hook in logging.rs logs
# through it.
tauri-plugin-log = "2"
portable-pty = "0.9"
fontdb = "0.24.0"
# Resolve the platform's config/data dirs without a running Tauri app, so
# `hivefield --doctor` (a pre-boot arg check in main.rs) can report the same
# app-scoped paths Tauri resolves in-process (see diagnostics.rs).
dirs = "6"
# ureq v3 — v2 is unmaintained upstream. TLS (rustls) is a default feature
# in v3 (the old `tls` feature no longer exists). v3 dropped `Error::Status`,
# so HTTP status handling uses the per-request `http_status_as_error(false)`
# config instead (see net.rs).
ureq = "3"
# Release tarball extraction for the built-in updater (updater.rs). install.sh
# uses the system `tar`; the app reads the archive directly so it never has to
# shell out. flate2 is already in the tree via other deps; tar is new.
tar = "0.4"
flate2 = "1"
# SHA-256 verification of downloaded release assets against the release's
# checksums.txt (see updater.rs verify_checksum).
sha2 = "0.11"

[features]
default = []
# Embed the Windows app manifest into test binaries (see build.rs). CI runs
# `cargo test --lib --features test-manifest` so the --lib test harness gets
# the Common-Controls v6 manifest and starts; enabling it only in tests keeps
# normal builds (tauri dev / release) untouched.
test-manifest = []

[dev-dependencies]
tempfile = "3"
