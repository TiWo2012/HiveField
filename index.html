<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>hiveField Terminal</title>
    <link rel="stylesheet" href="/main.css" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1e1e2e;
        overflow: hidden;
      }
      #app {
        display: flex;
        height: 100%;
      }
      #sidebar {
        width: 180px;
        flex: 0 0 auto;
        height: 100%;
      }
      #terminal {
        flex: 1 1 auto;
        min-width: 0;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar"></aside>
      <div id="terminal"></div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
